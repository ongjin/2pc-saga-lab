services:
  order-db:
    image: postgres:16
    command: ["postgres", "-c", "max_prepared_transactions=20"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: orderdb
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orderdb"]
      interval: 2s
      timeout: 2s
      retries: 20

  payment-db:
    image: postgres:16
    command: ["postgres", "-c", "max_prepared_transactions=20"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: paymentdb
    ports:
      - "5434:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d paymentdb"]
      interval: 2s
      timeout: 2s
      retries: 20

  inventory-db:
    image: postgres:16
    command: ["postgres", "-c", "max_prepared_transactions=20"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: inventorydb
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inventorydb"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  order-db-data:
  payment-db-data:
  inventory-db-data:
